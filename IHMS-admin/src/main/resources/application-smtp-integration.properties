# Opt-in, isolated MySQL only. Never activate alongside demo.
# No datasource/credential fallback to the user's normal local database.
server.address=127.0.0.1
server.port=21290
spring.datasource.url=${IHMS_SMTP_TEST_MYSQL_URL}
spring.datasource.username=${IHMS_SMTP_TEST_MYSQL_USERNAME}
spring.datasource.password=${IHMS_SMTP_TEST_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
model-runtime.auto-start=false
disease-risk.expected-model-version=${IHMS_SMTP_TEST_MODEL_VERSION:nhefs5-local-20261026}
health-notification.mode=SMTP
health-notification.smtp.enabled=true
health-notification.smtp.host=smtp.qq.com
health-notification.smtp.port=465
health-notification.smtp.security=SSL_TLS
health-notification.smtp.from=${IHMS_SMTP_TEST_FROM}
health-notification.smtp.username=${IHMS_SMTP_TEST_FROM}
health-notification.smtp.password=${IHMS_SMTP_TEST_AUTH_CODE}
health-notification.smtp.allowed-recipients=${IHMS_SMTP_ALLOWED_RECIPIENTS:}
health-notification.worker-enabled=true
# Never log JDBC/MyBatis parameters, verification tokens or contacts during this run.
logging.level.root=INFO
logging.level.com.star=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
spring.mail.properties.mail.debug=false
