# Inactive unless explicitly combined with demo AND the process opt-in below.
server.address=127.0.0.1
health-notification.local-test.enabled=${IHMS_LOCAL_MAIL_ENABLED:false}
health-notification.local-test.user-account=${IHMS_LOCAL_MAIL_USER:}
health-notification.mode=${IHMS_LOCAL_MAIL_MODE:MOCK}
health-notification.smtp.enabled=${IHMS_LOCAL_MAIL_ENABLED:false}
health-notification.smtp.host=smtp.qq.com
health-notification.smtp.port=465
health-notification.smtp.security=SSL_TLS
health-notification.smtp.from=${IHMS_SMTP_TEST_FROM:}
health-notification.smtp.username=${IHMS_SMTP_TEST_FROM:}
health-notification.smtp.password=${IHMS_SMTP_TEST_AUTH_CODE:}
health-notification.smtp.allowed-recipients=${IHMS_LOCAL_MAIL_TO:}
logging.level.root=INFO
logging.level.com.star=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.com.zaxxer.hikari=WARN
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
